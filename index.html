  {

    "topic": "Seguridad en redes",
    "question": "¿Qué busca la seguridad en redes y por qué resulta cada vez más relevante?",

      "Garantizar que las comunicaciones nunca se interrumpan, sin considerar quién accede a los datos.",
      "Evitar accesos externos mediante contraseñas, dejando fuera del alcance las amenazas internas."
    ],
    "explanation": "La seguridad protege confidencialidad, integridad y disponibilidad. No se limita a continuidad del servicio ni a amenazas externas; también considera errores, permisos y riesgos internos."

  {
    "id": 2,
    "group": "Conceptos fundamentales",

    "question": "En un sistema de notas, solo acceden personas autorizadas, no se permiten cambios indebidos y el servicio está accesible. ¿Qué orden corresponde?",

      "Confidencialidad, integridad y disponibilidad.",
      "Integridad, confidencialidad y disponibilidad.",
      "Confidencialidad, disponibilidad e integridad."
    ],
    "explanation": "Restringir quién accede corresponde a confidencialidad; impedir cambios indebidos, a integridad; mantener el servicio accesible, a disponibilidad. El orden de los ejemplos es importante."

  {
    "id": 3,
    "group": "Conceptos fundamentales",
    "topic": "Autenticación y no repudio",

    "options": [
      "La autenticación verifica identidad; el no repudio aporta evidencia de autoría u origen.",
      "La autenticación comprueba que un archivo no cambió; el no repudio comprueba quién inicia sesión.",
      "La autenticación y el no repudio se obtienen siempre que el usuario ingresa una contraseña válida."
    ],
    "explanation": "Autenticar es verificar identidad. El no repudio requiere evidencia de origen o autoría, por ejemplo una firma digital validada. Comprobar que un archivo no cambió se relaciona con integridad; una contraseña por sí sola no garantiza no repudio."
  },
  {
    "id": 4,
    "group": "Amenazas y ataques",
    "topic": "Caso de ransomware",
    "question": "¿Qué ocurrió en el ataque a Change Healthcare de 2024?",
    "options": [
      "El acceso con credenciales comprometidas a un portal sin MFA precedió al ransomware y a interrupciones de pagos y reclamos médicos.",
      "Un DDoS contra el portal público saturó los enlaces, sin acceso indebido ni cifrado de sistemas internos.",
      "Un portal con MFA resistió el acceso remoto y el incidente quedó limitado a correos de phishing sin impacto operativo."
    ],
    "explanation": "El acceso se produjo con credenciales comprometidas en un portal Citrix sin MFA. Luego hubo movimiento lateral, robo de datos y ransomware. Se afectó el procesamiento de pagos y reclamos; no fue solamente saturación externa ni una campaña sin consecuencias.",
    "source": "https://apnews.com/article/9e2fff70ce4f93566043210bdd347a1f"
  },
  {
    "id": 5,
    "group": "Amenazas y ataques",
    "topic": "DoS y DDoS",
    "question": "¿Por qué suele ser más difícil mitigar un DDoS que un DoS de un solo origen?",
    "options": [
      "El tráfico proviene de múltiples orígenes y cuesta bloquearlo sin afectar usuarios legítimos.",
      "Porque un DDoS cifra las solicitudes y un DoS siempre utiliza solicitudes sin cifrar.",
      "Porque todo DDoS explota una vulnerabilidad desconocida, mientras que un DoS solo usa fallas corregidas."
    ],
    "explanation": "La diferencia clave es la distribución entre múltiples fuentes. Eso dificulta filtrar y puede agotar recursos. Ni el cifrado del tráfico ni la existencia de una vulnerabilidad desconocida definen un DDoS."
  },
  {
    "id": 6,
    "group": "Amenazas y ataques",
    "topic": "Campaña de phishing",
    "question": "En la campaña Storm-2372 documentada en 2025, ¿qué engaño usaron los atacantes?",
    "options": [
      "Invitaciones falsas a reuniones de Teams para inducir a completar un flujo de autenticación con código de dispositivo.",
      "Invitaciones falsas a Teams que instalaban ransomware por el solo hecho de leer el asunto del correo.",
      "Mensajes que pedían cambiar el DNS del router para obtener acceso directo a las cuentas de Microsoft."
    ],
    "explanation": "La campaña usaba invitaciones falsas y códigos de dispositivo para conseguir tokens de acceso mediante la interacción de la víctima. No dependía de cambiar el DNS ni de ejecutar ransomware al leer el asunto.",
    "source": "https://www.microsoft.com/en-us/security/blog/2025/02/13/storm-2372-conducts-device-code-phishing-campaign/"

    "explanation": "El punto de acceso falso controlado por el atacante puede situarlo entre la víctima y la red. Compartir un SSID no basta por sí solo. TLS correctamente validado protege el contenido cifrado incluso si alguien intermedia la conexión. Bettercap permite estudiar estos escenarios en auditorías autorizadas.",

  },
  {
    "id": 8,
    "group": "Amenazas y ataques",
    "topic": "Sniffing y spoofing",
    "question": "¿Cuál es la diferencia entre sniffing y spoofing?",
    "options": [
      "Sniffing captura tráfico; spoofing falsifica una identidad o información de origen.",
      "Sniffing modifica direcciones de origen; spoofing captura paquetes sin alterar identidades.",
      "Sniffing solo captura tráfico cifrado; spoofing solo captura tráfico sin cifrar."
    ],
    "explanation": "Sniffing consiste en capturar tráfico. Spoofing falsifica una identidad u origen, como una dirección IP o MAC. La distinción no depende de si el tráfico está cifrado; las técnicas pueden combinarse."
  },
  {

    "group": "Herramientas y protección",
    "topic": "Tipos de firewall",

const KEY='redes-examen-opciones-v2';
const app=document.querySelector('#app');
const dialog=document.querySelector('#confirm');
const shuffle=items=>{const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function differentShuffle(items,previous){let a=shuffle(items);if(previous&&a.every((v,i)=>v===previous[i]))a.push(a.shift());return a;}
let state,filter='all',storageOK=true;
function fresh(previous){return {order:differentShuffle(QUESTIONS.map(q=>q.id),previous?.order),options:Object.fromEntries(QUESTIONS.map(q=>[q.id,differentShuffle([0,1,2],previous?.options[q.id])])),answers:{},index:0,done:false,attempt:(previous?.attempt||0)+1};}
function valid(s){return s&&typeof s.done==='boolean'&&Number.isInteger(s.attempt)&&Number.isInteger(s.index)&&s.index>=0&&s.index<23&&Array.isArray(s.order)&&s.order.length===23&&new Set(s.order).size===23&&s.order.every(id=>QUESTIONS.some(q=>q.id===id)&&Array.isArray(s.options?.[id])&&[...s.options[id]].sort().join()==='0,1,2')&&s.answers&&Object.entries(s.answers).every(([k,v])=>s.order.includes(Number(k))&&[0,1,2].includes(v));}
try{const saved=JSON.parse(localStorage.getItem(KEY));state=valid(saved)?saved:fresh();}catch{state=fresh();storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageOK=false;}}
const getQuestion=id=>QUESTIONS.find(q=>q.id===id);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){save();if(state.done)return results();const q=getQuestion(state.order[state.index]),count=Object.keys(state.answers).length;
app.innerHTML=`<div class="layout"><aside class="panel sidebar" aria-label="Navegación del examen"><div class="eyebrow">Intento ${state.attempt}</div><p class="count" style="margin:10px 0">${count} <span class="small">/ 23 respondidas</span></p><div class="progress" role="progressbar" aria-label="Preguntas respondidas" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="23"><div style="width:${count/23*100}%"></div></div><div class="grid">${state.order.map((id,i)=>`<button class="jump ${state.answers[id]!==undefined?'answered':''} ${i===state.index?'current':''}" data-jump="${i}" aria-label="Pregunta ${i+1}${state.answers[id]!==undefined?', respondida':', pendiente'}" ${i===state.index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><p class="note">Podés volver a cualquier pregunta y cambiar tu respuesta antes de entregar.</p><button class="btn primary finish" id="finish">Finalizar examen</button></aside><section class="panel" aria-labelledby="question"><span class="badge">${q.group}</span><span class="badge topic">${q.topic}</span><p class="question-number">PREGUNTA ${state.index+1} DE 23</p><h2 id="question" tabindex="-1">${q.question}</h2><div class="options" role="radiogroup" aria-labelledby="question">${state.options[q.id].map((v,i)=>`<label class="option"><input type="radio" name="answer" value="${v}" ${state.answers[q.id]===v?'checked':''}><span><span class="letter">${'ABC'[i]}.</span> ${q.options[v]}</span></label>`).join('')}</div><div class="actions"><button class="btn" id="prev" ${state.index===0?'disabled':''}>← Anterior</button><button class="btn primary" id="next">${state.index===22?'Revisar y entregar':'Siguiente →'}</button></div><p class="note" id="save-note" aria-live="polite">${storageOK?'Tu progreso se guarda automáticamente.':'El guardado no está disponible. Mantené esta pestaña abierta.'}</p></section></div>`;
app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>go(Number(b.dataset.jump)));app.querySelectorAll('input').forEach(input=>input.onchange=()=>{state.answers[q.id]=Number(input.value);save();const focused=input.value;render();app.querySelector(`input[value="${focused}"]`).focus();});app.querySelector('#prev').onclick=()=>go(state.index-1);app.querySelector('#next').onclick=()=>state.index===22?confirmEnd():go(state.index+1);app.querySelector('#finish').onclick=confirmEnd;}
function go(index){state.index=index;render();document.querySelector('#question').focus();}
function confirmEnd(){const pending=23-Object.keys(state.answers).length;document.querySelector('#confirm-text').textContent=pending?`Te quedan ${pending} preguntas sin responder. Si entregás ahora, contarán como incorrectas.`:'Respondiste las 23 preguntas. Vas a ver tu puntaje y las explicaciones.';dialog.showModal();}
document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#deliver').onclick=()=>{dialog.close();state.done=true;filter='all';render();window.scrollTo({top:0,behavior:'smooth'});};
function results(){const correct=QUESTIONS.filter(q=>state.answers[q.id]===0).length;const groups=[...new Set(QUESTIONS.map(q=>q.group))];const pending=23-Object.keys(state.answers).length;
app.innerHTML=`<section aria-label="Resultado"><div class="score"><div><div class="eyebrow" style="color:#d6e5b7">Resultado · Intento ${state.attempt}</div><strong>${correct}<span style="font-size:28px;color:#bdcfbd"> / 23</span></strong><p>${Math.round(correct/23*100)}% de aciertos · ${23-correct-pending} incorrectas · ${pending} sin responder</p></div><button class="btn" id="retry">Repetir examen ↗</button></div><h2>Tu desempeño por tema</h2><div class="topics">${groups.map(g=>{const qs=QUESTIONS.filter(q=>q.group===g);return `<div class="topic-result"><small>${g}</small><strong>${qs.filter(q=>state.answers[q.id]===0).length} / ${qs.length} correctas</strong></div>`;}).join('')}</div><h2>Aprendé de cada respuesta</h2><p class="small">La respuesta correcta y su explicación aparecen debajo de cada pregunta.</p><div class="filter"><button class="btn ${filter==='all'?'active':''}" data-filter="all">Todas (23)</button><button class="btn ${filter==='errors'?'active':''}" data-filter="errors">Errores y pendientes (${23-correct})</button></div><div id="reviews">${state.order.map((id,i)=>{const q=getQuestion(id),answer=state.answers[id],ok=answer===0;if(filter==='errors'&&ok)return '';return `<article class="panel review"><span class="status ${ok?'good':'bad'}">${ok?'✓ Correcta':answer===undefined?'○ Sin responder':'✕ Incorrecta'}</span><span class="badge topic" style="margin-left:10px">${q.topic}</span><div class="small">${q.group}</div><h3>${i+1}. ${q.question}</h3>${!ok?`<p class="answer wrong"><b>Tu respuesta:</b> ${answer===undefined?'No seleccionaste una opción.':escapeHTML(q.options[answer])}</p>`:''}<p class="answer"><b>Respuesta correcta:</b> ${q.options[0]}</p><p class="explain"><b>${ok?'Por qué es correcta:':'Para repasar:'}</b> ${q.explanation}</p>${q.source?`<a class="source" href="${q.source}" target="_blank" rel="noopener noreferrer">Consultar fuente ↗</a>`:''}${q.id===21?' · <a class="source" href="https://institucional.telecom.com.ar/assets/files/sustainability/reports/file_download_grid/Reporte%20Sustentabilidad%202020%20Integrado_Esp.pdf" target="_blank" rel="noopener noreferrer">Reporte de Telecom ↗</a>':''}</article>`;}).join('')||'<div class="panel"><h3>¡Sin errores para repasar!</h3><p>Respondiste correctamente las 23 preguntas.</p></div>'}</div></section>`;
app.querySelector('#retry').onclick=()=>{state=fresh(state);filter='all';render();window.scrollTo({top:0,behavior:'smooth'});};app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;results();});}
render();

},
