const start={"seguridad":function(){
const QUESTIONS = [
['Conceptos fundamentales','Seguridad en redes','¿Qué busca la seguridad en redes y por qué resulta cada vez más relevante?', ['Proteger datos, dispositivos y comunicaciones ante riesgos que crecen con la conectividad.','Aumentar el ancho de banda para que todos los dispositivos naveguen más rápido.','Mantener únicamente el hardware para evitar fallas físicas.'], 'La seguridad reduce riesgos para la información y los servicios. La velocidad y el mantenimiento físico pueden ayudar a operar, pero no cubren accesos indebidos, fraude ni ataques.'],
['Conceptos fundamentales','Tríada CIA','En un sistema de notas, solo acceden personas autorizadas, no se permiten cambios indebidos y el servicio está accesible. ¿Qué orden corresponde?', ['Confidencialidad, integridad y disponibilidad.','Integridad, disponibilidad y confidencialidad.','Disponibilidad, confidencialidad e integridad.'], 'Confidencialidad limita quién ve los datos; integridad protege contra alteraciones indebidas; disponibilidad permite acceder al servicio cuando se necesita.'],
['Conceptos fundamentales','Autenticación y no repudio','¿Cuál distingue correctamente autenticación de no repudio?', ['La autenticación verifica identidad; el no repudio aporta evidencia de autoría u origen.','La autenticación cifra archivos; el no repudio crea copias de seguridad.','Ambos consisten exclusivamente en ingresar una contraseña.'], 'Ingresar con una credencial verifica identidad. Una firma digital validada puede aportar evidencia de autoría e integridad para el no repudio; una contraseña por sí sola no ofrece la misma evidencia.'],
['Amenazas y ataques','Caso de ransomware','¿Qué ocurrió en el ataque a Change Healthcare de 2024?', ['El acceso con credenciales comprometidas a un portal sin MFA precedió al ransomware y a interrupciones de pagos y reclamos médicos.','Un ataque DDoS solo saturó su página pública y no afectó sus sistemas internos.','Una falla de Wi-Fi doméstico borró sus bases de datos sin intervención de atacantes.'], 'El caso combinó acceso indebido y ransomware. Se interrumpieron servicios de procesamiento de pagos y reclamos; la respuesta incluyó aislar sistemas y reconstruir servicios. No fue simplemente saturación de una web.', 'https://apnews.com/article/9e2fff70ce4f93566043210bdd347a1f'],
['Amenazas y ataques','DoS y DDoS','¿Por qué suele ser más difícil mitigar un DDoS que un DoS de un solo origen?', ['El tráfico proviene de múltiples orígenes y cuesta bloquearlo sin afectar usuarios legítimos.','Un DDoS siempre roba contraseñas, mientras que un DoS cifra archivos.','Un DDoS solamente funciona en conexiones inalámbricas.'], 'Ambos buscan afectar la disponibilidad. La distribución entre muchas fuentes aumenta la dificultad de filtrar el ataque y puede agotar enlaces o servicios.'],
['Amenazas y ataques','Campaña de phishing','En la campaña Storm-2372 documentada en 2025, ¿qué engaño usaron los atacantes?', ['Invitaciones falsas a reuniones de Teams para inducir a completar un flujo de autenticación con código de dispositivo.','Actualizaciones físicas de routers entregadas obligatoriamente a todos los usuarios.','Un corte eléctrico que revelaba automáticamente las contraseñas.'], 'El engaño aprovechó una invitación aparentemente legítima para que la víctima autorizara acceso mediante un código. El phishing también puede abusar de flujos reales de inicio de sesión; no siempre usa una página falsa que pide una contraseña.', 'https://www.microsoft.com/en-us/security/blog/2025/02/13/storm-2372-conducts-device-code-phishing-campaign/'],
['Amenazas y ataques','Man in the Middle','¿Qué escenario puede facilitar un Man in the Middle en una Wi-Fi pública?', ['Conectarse a un punto de acceso falso controlado por un atacante que intermedia el tráfico.','Mantener el sistema y el navegador actualizados.','Usar una red cuyo nombre sea visible, sin ninguna otra condición.'], 'Un punto de acceso falso puede colocar al atacante en el camino de las comunicaciones. TLS correctamente validado protege el contenido cifrado: intermediar no implica descifrarlo. Bettercap es una herramienta usada en auditorías autorizadas de este tipo.', 'https://www.bettercap.org/'],
['Amenazas y ataques','Sniffing y spoofing','¿Cuál es la diferencia entre sniffing y spoofing?', ['Sniffing captura tráfico; spoofing falsifica una identidad o información de origen.','Sniffing cifra tráfico; spoofing elimina archivos.','Ambos significan bloquear puertos en un firewall.'], 'Capturar paquetes permite observar tráfico, aunque su contenido puede estar cifrado. Suplantar una dirección IP, MAC u otra identidad es spoofing. Son técnicas distintas que pueden combinarse.'],
['Herramientas y protección','Tipos de firewall','¿Qué aporta cada evolución del firewall?', ['Filtrado: encabezados; stateful: estado de conexiones; NGFW: análisis de aplicaciones y protección avanzada.','Filtrado: aplicaciones; stateful: solo direcciones; NGFW: elimina la necesidad de reglas.','Todos analizan lo mismo y únicamente cambia su velocidad.'], 'El filtrado básico evalúa datos como IP, protocolo y puerto. Stateful considera el contexto de una conexión. NGFW suma funciones como identificación de aplicaciones e inspección avanzada, según configuración y capacidades.'],
['Herramientas y protección','IDS e IPS','¿Qué diferencia principal existe entre IDS e IPS?', ['El IDS detecta y alerta; un IPS configurado en línea puede bloquear tráfico malicioso.','El IDS cifra contraseñas y el IPS administra el Wi-Fi.','El IDS protege teléfonos y el IPS exclusivamente servidores.'], 'La diferencia está en detectar frente a intervenir para prevenir. Snort y Suricata pueden operar como IDS o IPS según el modo de implementación: no son categorías exclusivas de una marca.'],
['Herramientas y protección','TLS y HTTPS','¿Qué significa el indicador de conexión segura de un navegador?', ['La conexión usa TLS y el certificado fue aceptado; no garantiza que el sitio sea honesto.','El sitio está libre de estafas porque usa HTTPS.','La página pertenece necesariamente a un organismo oficial.'], 'TLS protege la confidencialidad e integridad de la conexión y permite autenticar al servidor mediante certificados. SSL es su predecesor obsoleto. La forma del indicador varía entre navegadores; una web fraudulenta también puede tener HTTPS.'],
['Herramientas y protección','VPN','¿Cómo funciona una VPN y cuándo resulta útil?', ['Crea un túnel protegido hacia un servidor o red; sirve para acceder a recursos de una organización a distancia.','Elimina el malware y garantiza anonimato absoluto.','Hace que cualquier página web sea confiable.'], 'La VPN protege el tramo del túnel y puede dar acceso remoto a recursos privados. No reemplaza actualizaciones, HTTPS ni precauciones frente al phishing; el proveedor o la red de destino siguen siendo parte de la confianza.'],
['Herramientas y protección','Autenticación multifactor','¿Qué combinación es MFA?', ['Una contraseña y un código generado en una aplicación autenticadora de tu dispositivo.','Una contraseña y una pregunta de seguridad.','La misma contraseña ingresada dos veces.'], 'MFA combina factores de categorías distintas: algo que sabés, tenés o sos. Una aplicación autenticadora, una llave física y un código por SMS son posibles segundos factores, aunque no brindan la misma resistencia al phishing. Dos secretos memorizados siguen siendo un solo tipo de factor.'],
['Diseño de redes seguras','VLANs','¿Qué ventaja ofrece separar una red en VLANs?', ['Separar grupos de dispositivos y aplicar controles al tráfico entre segmentos.','Impedir automáticamente todos los ataques sin configurar reglas.','Reemplazar contraseñas y actualizaciones.'], 'Las VLANs separan dominios de broadcast y facilitan la segmentación. Para limitar acceso entre ellas se requieren ACL o firewalls y una configuración adecuada; la separación por sí sola no resuelve toda la seguridad.'],
['Diseño de redes seguras','DMZ','¿Por qué una base de datos sensible suele quedar en una red interna y no en la DMZ?', ['La DMZ aloja servicios expuestos; mantener la base en otro segmento restringido reduce su exposición.','La DMZ no admite servidores.','Toda DMZ elimina automáticamente el cifrado de los datos.'], 'Una DMZ separa servicios accesibles desde redes externas. Si un servidor público resulta comprometido, los controles hacia la red de datos ayudan a limitar el daño. Solo deben permitirse las conexiones necesarias.'],
['Diseño de redes seguras','VLAN hopping','¿Qué es VLAN hopping y cómo se reduce su riesgo?', ['Es intentar acceder a otra VLAN; se mitiga configurando puertos de acceso, troncales y VLAN nativa de forma segura.','Es cambiar el nombre de una VLAN; se evita ocultando el SSID.','Es saturar internet; se evita contratando más velocidad.'], 'Incluye técnicas como suplantar un switch o aprovechar doble etiquetado. Se recomienda evitar negociación automática de troncales donde no corresponde, limitar VLANs permitidas y no usar la VLAN nativa para usuarios.'],
['Gestión y normativa','NIST CSF','¿Qué establece el NIST Cybersecurity Framework 2.0?', ['Un marco para gestionar riesgos mediante Gobernar, Identificar, Proteger, Detectar, Responder y Recuperar.','Una garantía de que las organizaciones no sufrirán ataques.','Una ley que reemplaza todas las normas de cada país.'], 'El CSF organiza resultados y actividades de gestión de riesgos. No es una garantía ni sustituye la legislación. La versión 2.0 incluye Gobernar como una de sus seis funciones.', 'https://www.nist.gov/news-events/news/2024/02/nist-releases-version-20-landmark-cybersecurity-framework'],
['Gestión y normativa','CSIRT / CERT en Argentina','¿Qué es CERT.ar?', ['El equipo nacional de respuesta que coordina y apoya la gestión de incidentes informáticos.','Un antivirus obligatorio para cualquier computadora argentina.','Una empresa que vende certificados para sitios web.'], 'Un CSIRT/CERT es un equipo de respuesta a incidentes. CERT.ar trabaja en la coordinación de incidentes, prevención y protección del Sector Público Nacional y de infraestructuras críticas de información.', 'https://www.argentina.gob.ar/ciberseguridad/certar/funciones'],
['Gestión y normativa','Evidencia y cadena de custodia','¿Por qué se evalúa un equipo comprometido antes de apagarlo?', ['Podrían perderse datos volátiles; además, se debe documentar quién recoge, conserva y analiza la evidencia.','Apagarlo borra siempre todos los datos del disco.','Mantenerlo encendido garantiza que el atacante deje de actuar.'], 'La RAM y conexiones activas pueden aportar evidencia que se pierde al apagar. La cadena de custodia registra el manejo de esa evidencia para preservar su trazabilidad e integridad. La decisión depende de la contención y del protocolo: no significa dejar el equipo conectado sin control.'],
['Gestión y normativa','Legislación argentina','¿Qué asociación entre normas y contenidos es correcta?', ['Ley 25.326: protección de datos personales; Ley 26.388: incorporación y modificación de delitos informáticos en el Código Penal.','Ley 25.326: velocidades de Wi-Fi; Ley 26.388: nombres de VLANs.','Ambas son recomendaciones comerciales sin carácter legal.'], 'La Ley 25.326 regula la protección de datos personales. La Ley 26.388 reformó el Código Penal para contemplar conductas vinculadas con sistemas y datos informáticos. Son normas legales, distintas de marcos voluntarios como NIST.', 'https://www.argentina.gob.ar/jefatura/innovacion-publica/direccion-nacional-ciberseguridad/normativa'],
['Gestión y normativa','Casos de empresas argentinas','¿Qué afirmación corresponde a incidentes informados por Telecom y Mercado Libre?', ['Telecom informó contención de un ciberataque en 2020; Mercado Libre comunicó acceso no autorizado a datos de unos 300.000 usuarios en 2022.','Ambas empresas afirmaron que HTTPS hace imposible cualquier ataque.','Mercado Libre informó que el incidente de 2022 consistió únicamente en una falla eléctrica.'], 'Telecom describió la contención en su reporte 2020. Mercado Libre comunicó el acceso a datos y la activación de protocolos; su análisis inicial no encontró evidencia de obtención de contraseñas ni información de tarjetas. Esa declaración inicial no permite afirmar que nunca existieron otros impactos.', 'https://www.mercadolibre.com.mx/institucional/comunicamos/noticias/comunicado-mercado-libre-seguridad'],
['Configuración segura','Seguridad de una red','¿Qué conjunto de acciones mejora la seguridad de una red?', ['Inventariar equipos, segmentar, restringir accesos, actualizar, configurar firewall y revisar registros.','Permitir toda comunicación y conservar contraseñas predeterminadas.','Instalar un antivirus en un equipo y omitir los demás controles.'], 'La seguridad se construye con varias medidas: conocer los activos, aplicar mínimo privilegio, proteger la administración, actualizar y monitorear. También conviene disponer de copias de seguridad probadas y un plan de respuesta.'],
['Configuración segura','Wi-Fi doméstica','¿Qué configuración protege mejor una conexión Wi-Fi doméstica?', ['WPA3 o WPA2-AES, contraseñas robustas, firmware actualizado y WPS desactivado si no se necesita.','Ocultar el nombre de la red y dejarla sin contraseña.','Usar WEP y conservar la contraseña de administración original.'], 'WPA3 o WPA2 con AES protegen la conexión inalámbrica. También hay que cambiar las credenciales del administrador y actualizar el router. Ocultar el SSID no sustituye el cifrado, y WEP es inseguro.']
].map((q,i)=>({id:i+1,group:q[0],topic:q[1],question:q[2],options:q[3],explanation:q[4],source:q[5]}));

const KEY='redes-examen-v1';
const app=document.querySelector('#app');
const dialog=document.querySelector('#confirm');
const shuffle=items=>{const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function differentShuffle(items,previous){let a=shuffle(items);if(previous&&a.every((v,i)=>v===previous[i]))a.push(a.shift());return a;}
let state,filter='all',storageOK=true;
function fresh(previous){return {order:differentShuffle(QUESTIONS.map(q=>q.id),previous?.order),options:Object.fromEntries(QUESTIONS.map(q=>[q.id,differentShuffle([0,1,2],previous?.options[q.id])])),answers:{},index:0,done:false,attempt:(previous?.attempt||0)+1};}
function valid(s){return s&&typeof s.done==='boolean'&&Number.isInteger(s.attempt)&&Number.isInteger(s.index)&&s.index>=0&&s.index<23&&Array.isArray(s.order)&&s.order.length===23&&new Set(s.order).size===23&&s.order.every(id=>QUESTIONS.some(q=>q.id===id)&&Array.isArray(s.options?.[id])&&[...s.options[id]].sort().join()==='0,1,2')&&s.answers&&Object.entries(s.answers).every(([k,v])=>s.order.includes(Number(k))&&[0,1,2].includes(v));}
try{const saved=JSON.parse(localStorage.getItem(KEY));state=valid(saved)?saved:fresh();}catch{state=fresh();storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageOK=false;}}
const getQuestion=id=>QUESTIONS.find(q=>q.id===id);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){save();if(state.done)return results();const q=getQuestion(state.order[state.index]),count=Object.keys(state.answers).length;
app.innerHTML=`<div class="layout"><aside class="panel sidebar" aria-label="Navegación del examen"><div class="eyebrow">Intento ${state.attempt}</div><p class="count" style="margin:10px 0">${count} <span class="small">/ 23 respondidas</span></p><div class="progress" role="progressbar" aria-label="Preguntas respondidas" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="23"><div style="width:${count/23*100}%"></div></div><div class="grid">${state.order.map((id,i)=>`<button class="jump ${state.answers[id]!==undefined?'answered':''} ${i===state.index?'current':''}" data-jump="${i}" aria-label="Pregunta ${i+1}${state.answers[id]!==undefined?', respondida':', pendiente'}" ${i===state.index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><p class="note">Podés volver a cualquier pregunta y cambiar tu respuesta antes de entregar.</p><button class="btn primary finish" id="finish">Finalizar examen</button></aside><section class="panel" aria-labelledby="question"><span class="badge">${q.group}</span><span class="badge topic">${q.topic}</span><p class="question-number">PREGUNTA ${state.index+1} DE 23</p><h2 id="question" tabindex="-1">${q.question}</h2><div class="options" role="radiogroup" aria-labelledby="question">${state.options[q.id].map((v,i)=>`<label class="option"><input type="radio" name="answer" value="${v}" ${state.answers[q.id]===v?'checked':''}><span><span class="letter">${'ABC'[i]}.</span> ${q.options[v]}</span></label>`).join('')}</div><div class="actions"><button class="btn" id="prev" ${state.index===0?'disabled':''}>← Anterior</button><button class="btn primary" id="next">${state.index===22?'Revisar y entregar':'Siguiente →'}</button></div><p class="note" id="save-note" aria-live="polite">${storageOK?'Tu progreso se guarda automáticamente.':'El guardado no está disponible. Mantené esta pestaña abierta.'}</p></section></div>`;
app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>go(Number(b.dataset.jump)));app.querySelectorAll('input').forEach(input=>input.onchange=()=>{state.answers[q.id]=Number(input.value);save();const focused=input.value;render();app.querySelector(`input[value="${focused}"]`).focus();});app.querySelector('#prev').onclick=()=>go(state.index-1);app.querySelector('#next').onclick=()=>state.index===22?confirmEnd():go(state.index+1);app.querySelector('#finish').onclick=confirmEnd;}
function go(index){state.index=index;render();document.querySelector('#question').focus();}
function confirmEnd(){const pending=23-Object.keys(state.answers).length;document.querySelector('#confirm-text').textContent=pending?`Te quedan ${pending} preguntas sin responder. Si entregás ahora, contarán como incorrectas.`:'Respondiste las 23 preguntas. Vas a ver tu puntaje y las explicaciones.';dialog.showModal();}
document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#deliver').onclick=()=>{dialog.close();state.done=true;filter='all';render();window.scrollTo({top:0,behavior:'smooth'});};
function results(){const correct=QUESTIONS.filter(q=>state.answers[q.id]===0).length;const groups=[...new Set(QUESTIONS.map(q=>q.group))];const pending=23-Object.keys(state.answers).length;
app.innerHTML=`<section aria-label="Resultado"><div class="score"><div><div class="eyebrow" style="color:#d6e5b7">Resultado · Intento ${state.attempt}</div><strong>${correct}<span style="font-size:28px;color:#bdcfbd"> / 23</span></strong><p>${Math.round(correct/23*100)}% de aciertos · ${23-correct-pending} incorrectas · ${pending} sin responder</p></div><button class="btn" id="retry">Repetir examen ↗</button></div><h2>Tu desempeño por tema</h2><div class="topics">${groups.map(g=>{const qs=QUESTIONS.filter(q=>q.group===g);return `<div class="topic-result"><small>${g}</small><strong>${qs.filter(q=>state.answers[q.id]===0).length} / ${qs.length} correctas</strong></div>`;}).join('')}</div><h2>Aprendé de cada respuesta</h2><p class="small">La respuesta correcta y su explicación aparecen debajo de cada pregunta.</p><div class="filter"><button class="btn ${filter==='all'?'active':''}" data-filter="all">Todas (23)</button><button class="btn ${filter==='errors'?'active':''}" data-filter="errors">Errores y pendientes (${23-correct})</button></div><div id="reviews">${state.order.map((id,i)=>{const q=getQuestion(id),answer=state.answers[id],ok=answer===0;if(filter==='errors'&&ok)return '';return `<article class="panel review"><span class="status ${ok?'good':'bad'}">${ok?'✓ Correcta':answer===undefined?'○ Sin responder':'✕ Incorrecta'}</span><span class="badge topic" style="margin-left:10px">${q.topic}</span><div class="small">${q.group}</div><h3>${i+1}. ${q.question}</h3>${!ok?`<p class="answer wrong"><b>Tu respuesta:</b> ${answer===undefined?'No seleccionaste una opción.':escapeHTML(q.options[answer])}</p>`:''}<p class="answer"><b>Respuesta correcta:</b> ${q.options[0]}</p><p class="explain"><b>${ok?'Por qué es correcta:':'Para repasar:'}</b> ${q.explanation}</p>${q.source?`<a class="source" href="${q.source}" target="_blank" rel="noopener noreferrer">Consultar fuente ↗</a>`:''}${q.id===21?' · <a class="source" href="https://institucional.telecom.com.ar/assets/files/sustainability/reports/file_download_grid/Reporte%20Sustentabilidad%202020%20Integrado_Esp.pdf" target="_blank" rel="noopener noreferrer">Reporte de Telecom ↗</a>':''}</article>`;}).join('')||'<div class="panel"><h3>¡Sin errores para repasar!</h3><p>Respondiste correctamente las 23 preguntas.</p></div>'}</div></section>`;
app.querySelector('#retry').onclick=()=>{state=fresh(state);filter='all';render();window.scrollTo({top:0,behavior:'smooth'});};app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;results();});}
render();

},

const KEY='guia-packet-tracer-examen-v1';
const app=document.querySelector('#app');
const dialog=document.querySelector('#confirm');
const shuffle=items=>{const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function differentShuffle(items,previous){let a=shuffle(items);if(previous&&a.every((v,i)=>v===previous[i]))a.push(a.shift());return a;}
let state,filter='all',storageOK=true;
function fresh(previous){return {order:differentShuffle(QUESTIONS.map(q=>q.id),previous?.order),options:Object.fromEntries(QUESTIONS.map(q=>[q.id,differentShuffle([0,1,2],previous?.options[q.id])])),answers:{},index:0,done:false,attempt:(previous?.attempt||0)+1};}
function valid(s){return s&&typeof s.done==='boolean'&&Number.isInteger(s.attempt)&&Number.isInteger(s.index)&&s.index>=0&&s.index<32&&Array.isArray(s.order)&&s.order.length===32&&new Set(s.order).size===32&&s.order.every(id=>QUESTIONS.some(q=>q.id===id)&&Array.isArray(s.options?.[id])&&[...s.options[id]].sort().join()==='0,1,2')&&s.answers&&Object.entries(s.answers).every(([k,v])=>s.order.includes(Number(k))&&[0,1,2].includes(v));}
try{const saved=JSON.parse(localStorage.getItem(KEY));state=valid(saved)?saved:fresh();}catch{state=fresh();storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageOK=false;}}
const getQuestion=id=>QUESTIONS.find(q=>q.id===id);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){save();if(state.done)return results();const q=getQuestion(state.order[state.index]),count=Object.keys(state.answers).length;
app.innerHTML=`<div class="layout"><aside class="panel sidebar" aria-label="Navegación del examen"><div class="eyebrow">Intento ${state.attempt}</div><p class="count" style="margin:10px 0">${count} <span class="small">/ 32 respondidas</span></p><div class="progress" role="progressbar" aria-label="Preguntas respondidas" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="32"><div style="width:${count/32*100}%"></div></div><div class="grid">${state.order.map((id,i)=>`<button class="jump ${state.answers[id]!==undefined?'answered':''} ${i===state.index?'current':''}" data-jump="${i}" aria-label="Pregunta ${i+1}${state.answers[id]!==undefined?', respondida':', pendiente'}" ${i===state.index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><p class="note">Podés volver a cualquier pregunta y cambiar tu respuesta antes de entregar.</p><button class="btn primary finish" id="finish">Finalizar examen</button></aside><section class="panel" aria-labelledby="question"><span class="badge">${q.group}</span><span class="badge topic">${q.topic}</span><p class="question-number">PREGUNTA ${state.index+1} DE 32 · GUÍA #${q.id}</p><h2 id="question" tabindex="-1">${q.question}</h2><div class="options" role="radiogroup" aria-labelledby="question">${state.options[q.id].map((v,i)=>`<label class="option"><input type="radio" name="answer" value="${v}" ${state.answers[q.id]===v?'checked':''}><span><span class="letter">${'ABC'[i]}.</span> ${q.options[v]}</span></label>`).join('')}</div><div class="actions"><button class="btn" id="prev" ${state.index===0?'disabled':''}>← Anterior</button><button class="btn primary" id="next">${state.index===31?'Revisar y entregar':'Siguiente →'}</button></div><p class="note" id="save-note" aria-live="polite">${storageOK?'Tu progreso se guarda automáticamente.':'El guardado no está disponible. Mantené esta pestaña abierta.'}</p></section></div>`;
app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>go(Number(b.dataset.jump)));app.querySelectorAll('input').forEach(input=>input.onchange=()=>{state.answers[q.id]=Number(input.value);save();const focused=input.value;render();app.querySelector(`input[value="${focused}"]`).focus();});app.querySelector('#prev').onclick=()=>go(state.index-1);app.querySelector('#next').onclick=()=>state.index===31?confirmEnd():go(state.index+1);app.querySelector('#finish').onclick=confirmEnd;}
function go(index){state.index=index;render();document.querySelector('#question').focus();}
function confirmEnd(){const pending=32-Object.keys(state.answers).length;document.querySelector('#confirm-text').textContent=pending?`Te quedan ${pending} preguntas sin responder. Si entregás ahora, contarán como incorrectas.`:'Respondiste las 32 preguntas. Vas a ver tu puntaje y las explicaciones.';dialog.showModal();}
document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#deliver').onclick=()=>{dialog.close();state.done=true;filter='all';render();window.scrollTo({top:0,behavior:'smooth'});};

Respondiste correctamente las 32 preguntas.</p></div>'}</div></section>`;
app.querySelector('#retry').onclick=()=>{state=fresh(state);filter='all';render();window.scrollTo({top:0,behavior:'smooth'});};app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;results();});}
render();
